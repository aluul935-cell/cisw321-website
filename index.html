<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Website - CISW 321</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #fcfcfc; 
            font-family: 'Varela Round', sans-serif;
            color: #333333;
            margin: 0;
            padding: 40px;
        }
       
        .header-container {
            display: flex;
            align-items: center; 
            gap: 30px; 
            padding-bottom: 20px;
            border-bottom: 2px solid #dddddd; 
            max-width: 800px;
            margin: 0 auto;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
        }

        .header-text h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #444444;
        }

        .header-text p {
            font-size: 16px;
            margin: 5px 0;
            color: #666666;
        }
    </style>
</head>
<body>

    <header class="header-container">
        <img src="avatar.png" alt="My Avatar" class="avatar">
        
        <div class="header-text">
            <h1>Welcome to my website!</h1>
            <p>CISW 321 Student</p>
            <p>Creating cool pages with code</p>
        </div>
    </header>

</body>
</html>
